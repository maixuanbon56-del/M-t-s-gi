<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mét sê gi" />
  <title>Mét sê gi</title>
  <style>
    :root {
      --theme-main: #0084ff;
      --theme-grad: linear-gradient(135deg, #0099ff, #0066ff);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { background: #ffffff; height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Banner thông báo nổi khi nhận tin nhắn */
    #inapp-toast {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 10px);
      left: 12px;
      right: 12px;
      background: rgba(28, 28, 30, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(-140%);
      transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1);
      cursor: pointer;
    }
    #inapp-toast.show { transform: translateY(0); }
    .toast-av {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--theme-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }
    .toast-body { min-width: 0; flex: 1; }
    .toast-title { font-size: 13.5px; font-weight: 700; }
    .toast-msg { font-size: 13px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* Header chuẩn Messenger */
    header {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: calc(env(safe-area-inset-top) + 8px) 12px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
      z-index: 20;
    }
    .chat-partner {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .avatar-wrap {
      position: relative;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--theme-grad);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .online-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 11px;
      height: 11px;
      background: #31a24c;
      border: 2px solid #fff;
      border-radius: 50%;
      display: none;
    }
    .online-dot.active { display: block; }
    .partner-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .partner-name {
      font-size: 15.5px;
      font-weight: 700;
      color: #050505;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .partner-status {
      font-size: 11.5px;
      color: #65676b;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .header-icon-btn {
      background: #f0f2f5;
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
