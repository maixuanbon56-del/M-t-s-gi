<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mét sê gi" />
  <title>Mét sê gi</title>
  <style>
    :root { --theme-main: #0084ff; --theme-grad: linear-gradient(135deg, #0099ff, #0066ff); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { background: #fff; height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; background-size: cover; background-position: center; background-repeat: no-repeat; }

    /* Thông báo nổi */
    #inapp-toast { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 12px; right: 12px; background: rgba(28,28,30,.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: #fff; padding: 12px 16px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.28); z-index: 200; display: flex; align-items: center; gap: 12px; transform: translateY(-300%); opacity: 0; pointer-events: none; transition: transform .3s cubic-bezier(.2,.9,.3,1), opacity .25s; cursor: pointer; }
    #inapp-toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .toast-av { width: 36px; height: 36px; border-radius: 50%; background: var(--theme-grad); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
    .toast-body { min-width: 0; flex: 1; }
    .toast-title { font-size: 13.5px; font-weight: 700; }
    .toast-msg { font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* Header */
    header { background: rgba(255,255,255,.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: calc(env(safe-area-inset-top) + 8px) 12px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: .5px solid rgba(0,0,0,.08); z-index: 20; }
    .chat-partner { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .avatar-wrap { position: relative; width: 38px; height: 38px; flex-shrink: 0; }
    .avatar, .mini-avatar { border-radius: 50%; background: var(--theme-grad); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar { width: 38px; height: 38px; font-size: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    .online-dot { position: absolute; bottom: 0; right: 0; width: 11px; height: 11px; background: #31a24c; border: 2px solid #fff; border-radius: 50%; display: none; }
    .online-dot.active { display: block; }
    .partner-info { display: flex; flex-direction: column; min-width: 0; }
    .partner-name { font-size: 15.5px; font-weight: 700; color: #050505; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .partner-status { font-size: 11.5px; color: #65676b; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .header-icon-btn { background: #f0f2f5; border: none; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--theme-main); cursor: pointer; }
    .header-icon-btn:active { transform: scale(.92); }

    /* Chat */
    #chat-box { flex: 1; overflow-y: auto; padding: 12px 12px 8px; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; }
    .msg-group { display: flex; flex-direction: column; margin-bottom: 2px; }
    .msg-group.new-block { margin-top: 10px; }
    .msg-group.me { align-items: flex-end; }
    .msg-group.other { align-items: flex-start; }
    .schedule-card { align-self: center; width: 92%; max-width: 360px; background: rgba(255,255,255,.96); border: 1px solid rgba(0,132,255,.25); border-radius: 18px; padding: 13px 15px; margin: 12px 0; box-shadow: 0 4px 14px rgba(0,0,0,.08); font-size: 13.5px; line-height: 1.48; color: #1c1e21; }
    .schedule-card-header { font-weight: 700; color: var(--theme-main); font-size: 14px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #f0f2f5; }
    .sender-name-tag { font-size: 11px; font-weight: 600; color: #65676b; margin: 0 0 3px 36px; background: rgba(255,255,255,.75); padding: 1px 6px; border-radius: 6px; }
    .bubble-line { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
    .msg-group.me .bubble-line { flex-direction: row-reverse; }
    .mini-avatar { width: 28px; height: 28px; font-size: 12px; }
    .mini-avatar.hidden { visibility: hidden; }
    .bubble { padding: 9px 14px; border-radius: 20px; font-size: 15.5px; line-height: 1.38; word-wrap: break-word; }
    .msg-group.me .bubble { background: var(--theme-grad); color: #fff; border-bottom-right-radius: 5px; }
    .msg-group.other .bubble { background: #f0f2f5; color: #050505; border-bottom-left-radius: 5px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .bubble.media-bubble { padding: 3px; background: transparent !important; box-shadow: none; }
    .bubble img { max-width: 230px; max-height: 300px; border-radius: 18px; display: block; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .bubble.heart-only { background: transparent !important; font-size: 38px; padding: 2px 4px; line-height: 1.1; }
    .msg-meta { font-size: 11px; color: #65676b; margin-top: 3px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,.75); display: none; }
    .msg-meta.show-always { display: inline-block; font-weight: 600; }

    /* Typing */
    #typing-bubble-row { display: none; align-items: flex-end; gap: 8px; margin-top: 8px; }
    .typing-dots { background: #f0f2f5; padding: 11px 15px; border-radius: 20px; border-bottom-left-radius: 5px; display: flex; gap: 4px; }
    .typing-dots span { width: 7px; height: 7px; background: #8a8d91; border-radius: 50%; animation: mType 1.3s infinite ease-in-out; }
    .typing-dots span:nth-child(2) { animation-delay: .18s; }
    .typing-dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes mType { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

    /* Footer */
    footer { background: rgba(255,255,255,.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); display: flex; align-items: flex-end; gap: 8px; border-top: .5px solid rgba(0,0,0,.08); }
    .action-icon, #send-btn { background: transparent; border: none; width: 34px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--theme-main); cursor: pointer; flex-shrink: 0; }
    #send-btn { font-size: 20px; }
    .input-pill { flex: 1; min-width: 0; background: #f0f2f5; border-radius: 20px; padding: 7px 14px; display: flex; align-items: center; min-height: 36px; }
    #msg-input { width: 100%; border: none; background: transparent; font-size: 16px; line-height: 1.35; outline: none; color: #050505; resize: none; max-height: 96px; }

    /* Bottom Sheet */
    #sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: none; opacity: 0; transition: opacity .25s; }
    #settings-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 22px 22px 0 0; padding: 12px 18px calc(env(safe-area-inset-bottom) + 20px); z-index: 60; transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -4px 24px rgba(0,0,0,.15); max-height: 85vh; overflow-y: auto; }
    #settings-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 38px; height: 5px; background: #d1d1d6; border-radius: 3px; margin: 0 auto 14px; }
    .sheet-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 16px; color: #050505; }
    .sheet-section { margin-bottom: 14px; }
    .sheet-label { font-size: 12px; font-weight: 600; color: #65676b; text-transform: uppercase; margin-bottom: 8px; }
    .role-toggle-box { display: flex; background: #f0f2f5; border-radius: 12px; padding: 3px; }
    .role-choice { flex: 1; border: none; background: transparent; padding: 9px; border-radius: 9px; font-size: 14px; font-weight: 700; color: #65676b; cursor: pointer; }
    .role-choice.active { background: #fff; color: var(--theme-main); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .color-grid { display: flex; justify-content: space-between; gap: 8px; }
    .color-swatch { width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
    .color-swatch.active { border-color: #050505; transform: scale(1.1); }
    .menu-btn { width: 100%; background: #f0f2f5; border: none; border-radius: 12px; padding: 12px 14px; font-size: 14.5px; font-weight: 600; color: #050505; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; cursor: pointer; }
    .menu-btn.danger { color: #ff3b30; background: #fff0f0; }

    /* Camera & Call Overlays */
    .full-overlay { position: fixed; inset: 0; background: #111318; z-index: 100; display: none; flex-direction: column; justify-content: space-between; color: #fff; overflow: hidden; }
    #cam-modal { background: #000; z-index: 120; }
    .full-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    .mirror { transform: scaleX(-1); }
    #cam-preview-img { display: none; z-index: 2; }
    .cam-top-bar { position: relative; z-index: 5; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; display: flex; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent); }
    .cam-round-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,.45); backdrop-filter: blur(8px); color: #fff; font-size: 18px; cursor: pointer; }
    .overlay-bottom { position: relative; z-index: 6; padding: 18px 12px calc(env(safe-area-inset-bottom) + 26px); background: linear-gradient(to top, rgba(0,0,0,.85), transparent); }
    .cam-shutter-row { display: flex; justify-content: center; }
    #cam-shutter-btn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #cam-shutter-btn::after { content: ""; width: 56px; height: 56px; border-radius: 50%; background: #fff; transition: transform .1s; }
    #cam-shutter-btn:active::after { transform: scale(.88); }
    .cam-confirm-row { display: none; justify-content: space-between; padding: 0 18px; }
    .cam-pill { border: none; border-radius: 24px; padding: 12px 24px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; }
    .cam-pill.retake { background: rgba(255,255,255,.2); backdrop-filter: blur(8px); }
    .cam-pill.send { background: var(--theme-grad); box-shadow: 0 4px 14px rgba(0,132,255,.4); }

    #local-preview-wrap { position: absolute; top: calc(env(safe-area-inset-top) + 16px); right: 16px; width: 108px; height: 156px; border-radius: 16px; overflow: hidden; border: 2px solid rgba(255,255,255,.35); box-shadow: 0 6px 20px rgba(0,0,0,.45); z-index: 5; background: #222; }
    #local-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #call-top-info { position: relative; z-index: 4; padding-top: calc(env(safe-area-inset-top) + 46px); text-align: center; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.65); }
    .call-avatar-big { width: 84px; height: 84px; border-radius: 50%; background: var(--theme-grad); margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    #call-peer-name { font-size: 24px; font-weight: 700; }
    #call-status-label { font-size: 14px; opacity: .85; margin-top: 6px; }
    .call-controls { display: flex; justify-content: center; align-items: center; gap: 18px; }
    .c-btn { width: 54px; height: 54px; border-radius: 50%; border: none; background: rgba(255,255,255,.2); backdrop-filter: blur(10px); color: #fff; font-size: 21px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .c-btn.muted { background: #fff; color: #050505; }
    .c-btn.end-call { background: #ff3b30; width: 62px; height: 62px; font-size: 24px; }
    .c-btn.accept-call { background: #31a24c; width: 62px; height: 62px; font-size: 24px; }
    #mini-call-bar { display: none; background: #31a24c; color: #fff; padding: 8px 14px; font-size: 13.5px; font-weight: 600; justify-content: space-between; align-items: center; cursor: pointer; z-index: 19; }
    #call-pip-btn { position: absolute; top: calc(env(safe-area-inset-top) + 16px); left: 16px; z-index: 7; font-size: 22px; }
    #call-overlay.minimized { opacity: 0; pointer-events: none; z-index: -1; }
  </style>
</head>
<body>
  <div id="inapp-toast">
    <div class="toast-av" id="toast-av">E</div>
    <div class="toast-body"><div class="toast-title" id="toast-title">Tin nhắn mới</div><div class="toast-msg" id="toast-msg">...</div></div>
  </div>

  <header>
    <div class="chat-partner">
      <div class="avatar-wrap"><div class="avatar" id="partner-avatar">E</div><div class="online-dot" id="partner-online-dot"></div></div>
      <div class="partner-info"><div class="partner-name" id="partner-name">Em</div><div class="partner-status" id="partner-status">Đang kiểm tra...</div></div>
    </div>
    <div class="header-right">
      <button type="button" class="header-icon-btn" id="open-cam-btn" title="Chụp ảnh">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      </button>
      <button type="button" class="header-icon-btn" id="audio-call-btn" title="Gọi thoại">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </button>
      <button type="button" class="header-icon-btn" id="video-call-btn" title="Gọi video">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </button>
      <button type="button" class="header-icon-btn" id="open-settings-btn" title="Tùy chỉnh">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  </header>
  <div id="mini-call-bar"><span>📞 Đang trong cuộc gọi • Bấm để quay lại</span><span id="mini-call-time">00:00</span></div>

  <input type="file" id="bg-input" accept="image/*" hidden />
  <input type="file" id="img-input" accept="image/*" hidden />

  <div id="chat-box">
    <div id="messages-container"></div>
    <div id="typing-bubble-row"><div class="mini-avatar" id="typing-avatar">E</div><div class="typing-dots"><span></span><span></span><span></span></div></div>
  </div>

  <footer>
    <button type="button" class="action-icon" id="img-btn" title="Chọn ảnh từ thư viện">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    </button>
    <div class="input-pill"><textarea id="msg-input" rows="1" placeholder="Nhắn tin..."></textarea></div>
    <button type="button" id="send-btn" title="Gửi">❤️</button>
  </footer>

  <!-- Cài đặt -->
  <div id="sheet-backdrop"></div>
  <div id="settings-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Tùy chỉnh cuộc trò chuyện</div>
    <div class="sheet-section">
      <div class="sheet-label">Bạn đang nhắn với tư cách</div>
      <div class="role-toggle-box"><button type="button" class="role-choice" id="choice-anh">Anh</button><button type="button" class="role-choice" id="choice-em">Em</button></div>
    </div>
    <div class="sheet-section">
      <div class="sheet-label">Màu chủ đề (Đồng bộ cả 2 bên)</div>
      <div class="color-grid" id="color-grid"></div>
    </div>
    <div class="sheet-section">
      <button type="button" class="menu-btn" id="notif-perm-btn"><span>🔔 Bật thông báo & âm thanh tin nhắn</span><span id="notif-status-text" style="color:var(--theme-main);font-size:13px;">Bật</span></button>
      <button type="button" class="menu-btn" id="send-tkb-now-btn"><span>📅 Gửi ngay lịch học ngày mai vào chat</span><span style="color:var(--theme-main);font-size:13px;">23:00 Tự động</span></button>
      <button type="button" class="menu-btn" id="rename-btn"><span>✏️ Đổi biệt danh Anh / Em</span><span id="rename-preview" style="color:#65676b;font-size:13px;">Anh & Em</span></button>
      <button type="button" class="menu-btn" id="bg-btn"><span>🖼️ Đổi ảnh nền cuộc trò chuyện</span><span style="color:var(--theme-main);font-size:13px;">Chọn ảnh</span></button>
      <button type="button" class="menu-btn" id="remove-bg-btn" style="display:none;"><span>🧹 Gỡ ảnh nền hiện tại</span></button>
      <button type="button" class="menu-btn danger" id="clear-btn"><span>🗑️ Xóa toàn bộ đoạn chat</span></button>
    </div>
  </div>

  <!-- Camera chụp ảnh -->
  <div id="cam-modal" class="full-overlay">
    <video id="cam-video" class="full-media mirror" autoplay playsinline muted></video>
    <img id="cam-preview-img" class="full-media" alt="Xem trước" />
    <div class="cam-top-bar">
      <button type="button" class="cam-round-btn" id="cam-close-btn">✖️</button>
      <button type="button" class="cam-round-btn" id="cam-flip-btn">🔄</button>
    </div>
    <div class="overlay-bottom">
      <div class="cam-shutter-row" id="cam-shutter-row"><button type="button" id="cam-shutter-btn"></button></div>
      <div class="cam-confirm-row" id="cam-confirm-row">
        <button type="button" class="cam-pill retake" id="cam-retake-btn">Chụp lại</button>
        <button type="button" class="cam-pill send" id="cam-send-btn">Gửi ảnh ➤</button>
      </div>
    </div>
  </div>

  <audio id="remote-audio" autoplay playsinline></audio>

  <!-- Gọi Thoại / Video -->
  <div id="call-overlay" class="full-overlay">
    <video id="remote-video" class="full-media" autoplay playsinline muted></video>
    <button type="button" class="cam-round-btn" id="call-pip-btn" title="Thu nhỏ / PiP">⌄</button>
    <div id="local-preview-wrap"><video id="local-video" class="mirror" autoplay playsinline muted></video></div>
    <div id="call-top-info">
      <div class="call-avatar-big" id="call-avatar-big">E</div>
      <div id="call-peer-name">Em</div>
      <div id="call-status-label">Đang kết nối...</div>
    </div>
    <div class="overlay-bottom">
      <div class="call-controls" id="active-call-controls">
        <button type="button" class="c-btn" id="flip-cam-btn">🔄</button>
        <button type="button" class="c-btn" id="toggle-mic-btn">🎙️</button>
        <button type="button" class="c-btn" id="toggle-cam-btn">📷</button>
        <button type="button" class="c-btn end-call" id="hangup-btn">📵</button>
      </div>
      <div class="call-controls" id="incoming-call-controls" style="display:none;">
        <button type="button" class="c-btn end-call" id="reject-call-btn">✖️</button>
        <button type="button" class="c-btn accept-call" id="accept-call-btn">📞</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, updateDoc, getDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const $ = id => document.getElementById(id);
    const db = getFirestore(initializeApp({
      apiKey: "AIzaSyC3F8UwljVUkAjV9FdnchYRjQgLdiYt_eA",
      authDomain: "message4703.firebaseapp.com",
      projectId: "message4703",
      storageBucket: "message4703.firebasestorage.app",

    const initPC = isCaller => {
      pc = new RTCPeerConnection(rtcCfg);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      const remV = new MediaStream(), remA = new MediaStream();
      $("remote-video").srcObject = remV;
      $("remote-audio").srcObject = remA;
      pc.ontrack = e => {
        (e.track.kind === "audio" ? remA : remV).addTrack(e.track);
        $("remote-audio").play().catch(() => {});
        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({ title: "Đang gọi với " + getName(otherRole()), artist: "Mét sê gi" });
        }
        if (!callTimer) {
          callSec = 0;
          callTimer = setInterval(() => {
            callSec++;
            const t = `${String(Math.floor(callSec/60)).padStart(2,"0")}:${String(callSec%60).padStart(2,"0")}`;
            $("call-status-label").textContent = $("mini-call-time").textContent = t;
            if (isVideoCall) $("call-top-info").style.opacity = ".65";
          }, 1000);
        }
      };
      const col = collection(db, "calls", "active", isCaller ? "offerCandidates" : "answerCandidates");
      pc.onicecandidate = e => { if (e.candidate) addDoc(col, e.candidate.toJSON()); };
      pc.onconnectionstatechange = () => { if (pc && ["disconnected","failed","closed"].includes(pc.connectionState)) cleanupCall(false); };
    };

    const startCall = async video => {
      isVideoCall = video;
      try {
        await getCallMedia(video);
        showCallUI(getName(otherRole()), "Đang đổ chuông...", false);
        initPC(true);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await setDoc(callDocRef, { caller: currentRole, callee: otherRole(), video, status: "ringing", offer: { type: offer.type, sdp: offer.sdp }, timestamp: Date.now() });
        const ringMsg = video ? "📹 Cuộc gọi video đến..." : "📞 Cuộc gọi thoại đến...";
        pushNtfy(getName(currentRole), ringMsg, 5);
        let ringCount = 0;
        clearInterval(ringPushTimer);
        ringPushTimer = setInterval(() => {
          if (++ringCount >= 7) return stopRinging();
          pushNtfy(getName(currentRole), ringMsg, 5);
        }, 3500);
        unsubCands = onSnapshot(collection(db, "calls", "active", "answerCandidates"), s => {
          s.docChanges().forEach(c => { if (c.type === "added" && pc?.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
        });
      } catch (err) { alert("Không thể mở camera/micro: " + err.message); cleanupCall(true); }
    };

    $("audio-call-btn").onclick = () => startCall(false);
    $("video-call-btn").onclick = () => startCall(true);
    $("reject-call-btn").onclick = $("hangup-btn").onclick = () => cleanupCall(true);

    onSnapshot(callDocRef, async snap => {
      if (!snap.exists()) { if (pc || $("call-overlay").style.display === "flex") cleanupCall(false); return; }
      const d = snap.data();
      if (Date.now() - d.timestamp > 60000 && d.status === "ringing") return cleanupCall(true);
      if (d.caller === currentRole && d.answer && pc && !pc.currentRemoteDescription) {
        stopRinging();
        await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      }
      if (d.callee === currentRole && d.status === "ringing" && $("call-overlay").style.display !== "flex") {
        isVideoCall = d.video;
        showCallUI(getName(d.caller), d.video ? "Cuộc gọi video đến..." : "Cuộc gọi thoại đến...", true);
        startInAppRing();
      }
    });

    $("accept-call-btn").onclick = async () => {
      try {
        stopRinging();
        const snap = await getDoc(callDocRef); if (!snap.exists()) return;
        const d = snap.data();
        await getCallMedia(d.video);
        $("incoming-call-controls").style.display = "none";
        $("active-call-controls").style.display = "flex";
        $("call-status-label").textContent = "Đang kết nối...";
        initPC(false);
        await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        await updateDoc(callDocRef, { status: "connected", answer: { type: ans.type, sdp: ans.sdp } });
        unsubCands = onSnapshot(collection(db, "calls", "active", "offerCandidates"), s => {
          s.docChanges().forEach(c => { if (c.type === "added" && pc) pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
        });
      } catch (err) { alert("Lỗi nhận cuộc gọi: " + err.message); cleanupCall(true); }
    };

    $("flip-cam-btn").onclick = async () => {
      if (!isVideoCall || !pc) return;
      callFacing = callFacing === "user" ? "environment" : "user";
      await getCallMedia(true);
      const track = localStream.getVideoTracks()[0];
      const sender = pc.getSenders().find(s => s.track?.kind === "video");
      if (sender && track) sender.replaceTrack(track);
    };
    $("toggle-mic-btn").onclick = e => {
      const muted = e.currentTarget.classList.toggle("muted");
      localStream?.getAudioTracks().forEach(t => t.enabled = !muted);
    };
    $("toggle-cam-btn").onclick = e => {
      const off = e.currentTarget.classList.toggle("muted");
      localStream?.getVideoTracks().forEach(t => t.enabled = !off);
    };

    $("call-pip-btn").onclick = async () => {
      const rv = $("remote-video");
      if (isVideoCall && rv.readyState >= 2) {
        try {
          if (rv.webkitSupportsPresentationMode?.("picture-in-picture")) rv.webkitSetPresentationMode("picture-in-picture");
          else if (document.pictureInPictureEnabled && rv.requestPictureInPicture) await rv.requestPictureInPicture();
        } catch {}
      }
      $("call-overlay").classList.add("minimized");
      $("mini-call-bar").style.display = "flex";
    };
    $("mini-call-bar").onclick = () => {
      exitPiP();
      $("mini-call-bar").style.display = "none";
      $("call-overlay").classList.remove("minimized");
    };

    // Tự khôi phục micro & loa nếu iOS tạm ngắt khi chuyển app
    document.addEventListener("visibilitychange", async () => {
      if (document.hidden || !pc) return;
      $("remote-audio").play().catch(() => {});
      const oldTrack = localStream?.getAudioTracks()[0];
      if (!oldTrack || oldTrack.readyState === "ended" || oldTrack.muted) {
        try {
          const fresh = await navigator.mediaDevices.getUserMedia({ audio: true });
          const newTrack = fresh.getAudioTracks()[0];
          newTrack.enabled = !$("toggle-mic-btn").classList.contains("muted");
          const sender = pc.getSenders().find(s => s.track?.kind === "audio");
          if (sender) await sender.replaceTrack(newTrack);
          if (oldTrack) { localStream.removeTrack(oldTrack); oldTrack.stop(); }
          localStream?.addTrack(newTrack);
        } catch {}
      }
    });

    applyUI();
  </script>
</body>
</html>
